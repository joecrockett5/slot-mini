[package]
name = "slot-mini"
description = "A slot-style cartridge launcher for the Miyoo Mini Plus on Onion OS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
desktop = ["slot-mini-gfx/desktop"]
# The seams the PC app (crates/slot-mini-pc) drives. The device binary is
# built without it, so none of that code is in it.
pc = []

[dependencies]
slot-mini-gfx = { path = "../slot-mini-gfx" }
slot-mini-store = { path = "../slot-mini-store" }
slot-mini-ui = { path = "../slot-mini-ui" }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
libc = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
crc32fast = { workspace = true }
miniz_oxide = "0.8"
ring = "0.17"
image-webp = { workspace = true }
jpeg-decoder = { version = "0.3", default-features = false }
png = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
