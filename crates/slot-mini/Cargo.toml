[package]
name = "slot-mini"
description = "A slot-style cartridge launcher for the Miyoo Mini Plus on Onion OS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
desktop = ["slot-mini-gfx/desktop"]

[dependencies]
slot-mini-gfx = { path = "../slot-mini-gfx" }
slot-mini-store = { path = "../slot-mini-store" }
slot-mini-ui = { path = "../slot-mini-ui" }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
libc = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
