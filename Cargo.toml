[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
version = "0.5.2"

[workspace.dependencies]
fontdue = "0.9"
png = "0.17"
minifb = { version = "0.28", default-features = false, features = ["x11"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
webpki-roots = "1"
image-webp = "0.2"
crc32fast = "1"
serde_json = "1"
libc = "0.2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Tests render many frames; keep them fast.
[profile.test]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
